# CI slot standard v1.3.0 (system1-quality): impl S1, S3, G1, G2, B1, L1, Z1 via quality-slots.yml;
# na S2, L2, L3, L4, P1 skipped in slot jobs. nocoo/base-ci v2026.16 actions pin; native macOS commands inlined.
name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml
