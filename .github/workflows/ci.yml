name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: nocoo/base-ci/.github/workflows/test-job.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runner: "macos-26"
      runtime: "none"
      timeout-minutes: 15
      command: |
        scripts/test.sh
        scripts/build.sh release
        python3 scripts/package_release.py --local-preview --output-dir dist/ci-preview
      env-json: '{"CODE_SIGN_IDENTITY": "-", "SHOWTIME_ARCH": "universal"}'
