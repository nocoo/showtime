name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runner: "macos-15"
      runtime: "none"
      timeout-minutes: 15
      command: |
        scripts/test.sh
        scripts/build.sh release
        python3 scripts/package_release.py --local-preview --output-dir dist/ci-preview
      env-json: '{"CODE_SIGN_IDENTITY": "-", "SHOWTIME_ARCH": "universal"}'
