# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S3, G1, G2, B1, L1, Z1 via showtime-quality.yml;
# na S2, L1.5, L2, L3, P1 skipped in slot jobs. nocoo/base-ci v2026.12 actions pin; 不用 nocoo/base-ci quality.yml。
name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/showtime-quality.yml
