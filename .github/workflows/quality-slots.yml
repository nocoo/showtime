# CI slot standard v1.3.0 (system1-quality): native macOS impl slots + na slots skipped.
# Inlined steps (no nested base-ci reusable workflows) so GitHub checks render as quality / <ID>: <Name> only.
name: Showtime Quality Slots

on:
  workflow_call:

permissions:
  contents: read

jobs:
  s1-typecheck:
    name: "S1: Types"
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore git commit mtimes
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          files = {f for f in subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.decode().split("\0") if f}
          mtimes = {}
          out = subprocess.run(["git", "log", "--format=COMMIT:%ct", "--name-only"], capture_output=True, text=True, check=True).stdout
          cur_ts = None
          for line in out.splitlines():
              if line.startswith("COMMIT:"):
                  cur_ts = int(line[7:])
              elif line and line in files and line not in mtimes and cur_ts is not None:
                  mtimes[line] = cur_ts
                  if len(mtimes) == len(files):
                      break
          for f, ts in mtimes.items():
              if os.path.exists(f):
                  os.utime(f, (ts, ts))
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-swift-debug-v1-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: ${{ runner.os }}-swift-debug-v1-
      - name: S1 typecheck
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/version.py check
          node --check Sources/Showtime/Resources/Demo/app.js
          swift build --package-path .
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/swiftlint
          key: ${{ runner.os }}-swiftlint-0.65.1
      - name: Install verified SwiftLint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/share/swiftlint"
          echo "${HOME}/.local/share/swiftlint" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/share/swiftlint:${PATH}"
          if ! command -v swiftlint >/dev/null || [ "$(swiftlint version)" != "0.65.1" ]; then
            curl -fsSL -o /tmp/swiftlint.zip \
              https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
            echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  /tmp/swiftlint.zip" | shasum -a 256 -c -
            rm -rf "${HOME}/.local/share/swiftlint"
            mkdir -p "${HOME}/.local/share/swiftlint"
            unzip -q /tmp/swiftlint.zip -d "${HOME}/.local/share/swiftlint"
          fi
          test "$(swiftlint version)" = "0.65.1"
      - name: S2 lint
        shell: bash
        run: |
          set -euo pipefail
          swiftlint lint --strict Sources Tests
          python3 -m py_compile scripts/*.py
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow-lint:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/lint-workflows@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secret-scan:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: nocoo/base-ci/.github/actions/scan-secrets@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependency-vulnerabilities:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/scan-dependencies@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          lockfiles: "examples/overlay-react/bun.lock"
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore git commit mtimes
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          files = {f for f in subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.decode().split("\0") if f}
          mtimes = {}
          out = subprocess.run(["git", "log", "--format=COMMIT:%ct", "--name-only"], capture_output=True, text=True, check=True).stdout
          cur_ts = None
          for line in out.splitlines():
              if line.startswith("COMMIT:"):
                  cur_ts = int(line[7:])
              elif line and line in files and line not in mtimes and cur_ts is not None:
                  mtimes[line] = cur_ts
                  if len(mtimes) == len(files):
                      break
          for f, ts in mtimes.items():
              if os.path.exists(f):
                  os.utime(f, (ts, ts))
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-swift-release-arm64-v1-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: ${{ runner.os }}-swift-release-arm64-v1-
      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          env-json: '{"CODE_SIGN_IDENTITY": "-", "SHOWTIME_ARCH": "arm64"}'
      - name: B1 release build
        shell: bash
        run: |
          set -euo pipefail
          scripts/build.sh release
          tar -cf dist/showtime-app.tar -C dist Showtime.app
      - name: Upload B1 build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: showtime-app
          path: dist/showtime-app.tar
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit-tests:
    name: "L1: Unit"
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: L1 unit tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build.sh
          sh -n scripts/showtime
          swift run --package-path . ShowtimeChecks
          python3 -m py_compile scripts/*.py
          python3 scripts/test_guides.py
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — not a Worker project"

  l3-integration:
    name: "L3: Integration"
    if: ${{ vars.ENABLE_L3 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — local HTTP integration runner requires unlocked GUI session"

  l4-e2e:
    name: "L4: E2E"
    if: ${{ vars.ENABLE_L4 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — native/media acceptance runs manually on unlocked desktop"

  p1-package:
    name: "P1: Package"
    needs:
      - b1-build
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download B1 build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: showtime-app
          path: dist
      - name: Package local preview archive
        shell: bash
        run: |
          set -euo pipefail
          tar -xf dist/showtime-app.tar -C dist
          python3 scripts/package_release.py --local-preview --output-dir dist/ci-preview
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  z1-gate:
    name: "Z1: Gate"
    needs:
      - s1-typecheck
      - s2-lint
      - s3-workflow-lint
      - g1-secret-scan
      - g2-dependency-vulnerabilities
      - b1-build
      - l1-unit-tests
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.gate.outputs.tested-sha }}
    steps:
      - id: gate
        uses: nocoo/base-ci/.github/actions/z1-gate@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          needs-json: ${{ toJSON(needs) }}
          expected-sha: ${{ github.sha }}
          required-jobs: |
            s1-typecheck=S1: Types
            s2-lint=S2: Lint
            s3-workflow-lint=S3: Workflow
            g1-secret-scan=G1: Secrets
            g2-dependency-vulnerabilities=G2: Dependencies
            b1-build=B1: Build
            l1-unit-tests=L1: Unit
            p1-package=P1: Package
          skipped-jobs: |
            l2-runtime=L2: Runtime
            l3-integration=L3: Integration
            l4-e2e=L4: E2E
