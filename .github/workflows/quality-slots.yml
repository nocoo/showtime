# CI slot standard v1.3.0 (system1-quality): native macOS impl slots + na slots skipped.
# Inlined steps (no nested base-ci reusable workflows) so GitHub checks render as quality / <ID>: <Name> only.
name: Showtime Quality Slots

on:
  workflow_call:

permissions:
  contents: read

jobs:
  s1-typecheck:
    name: "S1: Types"
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: S1 typecheck
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/version.py check
          node --check Sources/Showtime/Resources/Demo/app.js
          swift build --package-path .
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/swiftlint
          key: ${{ runner.os }}-swiftlint-0.65.1
      - name: Install verified SwiftLint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/share/swiftlint"
          echo "${HOME}/.local/share/swiftlint" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/share/swiftlint:${PATH}"
          if ! command -v swiftlint >/dev/null || [ "$(swiftlint version)" != "0.65.1" ]; then
            curl -fsSL -o /tmp/swiftlint.zip \
              https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
            echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  /tmp/swiftlint.zip" | shasum -a 256 -c -
            rm -rf "${HOME}/.local/share/swiftlint"
            mkdir -p "${HOME}/.local/share/swiftlint"
            unzip -q /tmp/swiftlint.zip -d "${HOME}/.local/share/swiftlint"
          fi
          test "$(swiftlint version)" = "0.65.1"
      - name: S2 lint
        shell: bash
        run: |
          set -euo pipefail
          swiftlint lint --strict Sources Tests
          python3 -m py_compile scripts/*.py
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow-lint:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/lint-workflows@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secret-scan:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: nocoo/base-ci/.github/actions/scan-secrets@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependency-vulnerabilities:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/scan-dependencies@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          lockfiles: "examples/overlay-react/bun.lock"
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure test environment
        uses: nocoo/base-ci/.github/actions/configure-env@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          env-json: '{"CODE_SIGN_IDENTITY": "-", "SHOWTIME_ARCH": "universal"}'
      - name: B1 release build and local preview package
        shell: bash
        run: |
          set -euo pipefail
          scripts/build.sh release
          python3 scripts/package_release.py --local-preview --output-dir dist/ci-preview
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit-tests:
    name: "L1: Unit Tests & Coverage"
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: L1 unit tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build.sh
          sh -n scripts/showtime
          swift run --package-path . ShowtimeChecks
          python3 -m py_compile scripts/*.py
          python3 scripts/test_guides.py
      - name: Record SHA
        id: record-sha
        if: always()
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — not a Worker project"

  l3-integration:
    name: "L3: Integration"
    if: ${{ vars.ENABLE_L3 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — local HTTP integration runner requires unlocked GUI session"

  l4-e2e:
    name: "L4: E2E"
    if: ${{ vars.ENABLE_L4 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — native/media acceptance runs manually on unlocked desktop"

  p1-package-check:
    name: "P1: Package Check"
    if: ${{ vars.ENABLE_P1 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — native app/SwiftPM package, not published to npm"

  z1-gate:
    name: "Z1: Gate"
    needs:
      - s1-typecheck
      - s2-lint
      - s3-workflow-lint
      - g1-secret-scan
      - g2-dependency-vulnerabilities
      - b1-build
      - l1-unit-tests
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Z1 aggregate slot jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          S1_SHA: ${{ needs.s1-typecheck.outputs.tested-sha }}
          S2_SHA: ${{ needs.s2-lint.outputs.tested-sha }}
          S3_SHA: ${{ needs.s3-workflow-lint.outputs.tested-sha }}
          G1_SHA: ${{ needs.g1-secret-scan.outputs.tested-sha }}
          G2_SHA: ${{ needs.g2-dependency-vulnerabilities.outputs.tested-sha }}
          L1_SHA: ${{ needs.l1-unit-tests.outputs.tested-sha }}
          B1_SHA: ${{ needs.b1-build.outputs.tested-sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          impl = [
              "s1-typecheck",
              "s2-lint",
              "s3-workflow-lint",
              "g1-secret-scan",
              "g2-dependency-vulnerabilities",
              "b1-build",
              "l1-unit-tests",
          ]
          na = [
              "l2-runtime",
              "l3-integration",
              "l4-e2e",
              "p1-package-check",
          ]
          bad_impl = [job for job in impl if needs[job]["result"] != "success"]
          bad_na = [job for job in na if needs[job]["result"] != "skipped"]
          if bad_impl:
              print("Implemented slot jobs not successful:", ", ".join(bad_impl))
              sys.exit(1)
          if bad_na:
              print("NA slot jobs must be skipped:", ", ".join(bad_na))
              sys.exit(1)
          PY
          for label in S1_SHA S2_SHA S3_SHA G1_SHA G2_SHA L1_SHA B1_SHA; do
            value="${!label}"
            test -n "$value"
            test "$value" = "$EXPECTED_SHA"
          done
          echo "Verified CI source ${EXPECTED_SHA}"
